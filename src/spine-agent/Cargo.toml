[package]
name = "spine-agent"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Agent interface for SPINE"

[features]
default = []
# Research code: human-interaction pacing (`enable_human_mode`), the neural
# protocol (`neural_protocol`, `transmit_neural`) and the Chameleon / speculation
# APIs on `handler` (`enable_chameleon*`). Pulls in spine-human, spine-agentic and,
# through spine-protocol, spine-neural and spine-crypto. The examples that need
# it say so via `required-features`.
research = ["dep:spine-agentic", "dep:spine-human", "spine-protocol/research"]

[dependencies]
spine-name = { path = "../spine-name", version = "2.0.2" }
spine-protocol = { path = "../spine-protocol", version = "2.0.2", default-features = false }
spine-parser = { path = "../spine-parser", version = "2.0.2" }
spine-compiler = { path = "../spine-compiler", version = "2.0.2" }
spine-wasm = { path = "../spine-wasm", version = "2.0.2" }
spine-human = { path = "../spine-human", version = "2.0.2", optional = true }
spine-agentic = { path = "../spine-agentic", version = "2.0.2", optional = true }
spine-transport = { path = "../spine-transport", version = "2.0.2" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
rustls-native-certs = "0.6"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }


[dev-dependencies]
spine-nostd = { path = "../spine-nostd" }
spine-embedded = { path = "../spine-embedded" }

[[example]]
name = "agent_autonomous"
path = "examples/agent_autonomous.rs"
required-features = ["research"]

[[example]]
name = "encrypted_agent"
path = "examples/encrypted_agent.rs"
required-features = ["research"]

[[example]]
name = "latent_analysis"
path = "examples/latent_analysis.rs"
required-features = ["research"]

[[example]]
name = "llm_workflow_demo"
path = "examples/llm_workflow_demo.rs"
required-features = ["research"]

[[example]]
name = "offline_demo"
path = "examples/offline_demo.rs"
required-features = ["research"]

[[example]]
name = "research_swarm"
path = "examples/research_swarm.rs"
required-features = ["research"]

[[example]]
name = "simple_agent"
path = "examples/simple_agent.rs"
required-features = ["research"]

[[example]]
name = "web_intelligence_demo"
path = "examples/web_intelligence_demo.rs"
required-features = ["research"]
