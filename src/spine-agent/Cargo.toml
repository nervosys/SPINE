[package]
name = "spine-agent"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Agent interface for SPINE"

[features]
default = []
# Research code: pulls in spine-agentic for the examples that use its workflow,
# runtime and knowledge-graph types. They say so via `required-features`. The
# SDK itself has no research-gated code.
# The Chameleon key is not here: it is in `research/spine-protocol-research`.
research = ["dep:spine-agentic"]

[dependencies]
spine-name = { path = "../spine-name", version = "2.0.2" }
spine-protocol = { path = "../spine-protocol", version = "2.0.2", default-features = false }
spine-parser = { path = "../spine-parser", version = "2.0.2" }
spine-compiler = { path = "../spine-compiler", version = "2.0.2" }
spine-wasm = { path = "../spine-wasm", version = "2.0.2" }
spine-agentic = { path = "../../research/spine-agentic", version = "2.0.2", optional = true }
spine-transport = { path = "../spine-transport", version = "2.0.2" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-native-certs = "0.8"
tracing = "0.1"


[dev-dependencies]
env_logger.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
spine-nostd = { path = "../../research/spine-nostd" }
spine-embedded = { path = "../../research/spine-embedded" }

[[example]]
name = "agent_autonomous"
path = "examples/agent_autonomous.rs"
required-features = ["research"]

[[example]]
name = "encrypted_agent"
path = "examples/encrypted_agent.rs"
required-features = ["research"]

[[example]]
name = "llm_workflow_demo"
path = "examples/llm_workflow_demo.rs"
required-features = ["research"]

[[example]]
name = "offline_demo"
path = "examples/offline_demo.rs"
required-features = ["research"]

[[example]]
name = "research_swarm"
path = "examples/research_swarm.rs"
required-features = ["research"]

[[example]]
name = "simple_agent"
path = "examples/simple_agent.rs"
required-features = ["research"]

[[example]]
name = "web_intelligence_demo"
path = "examples/web_intelligence_demo.rs"
required-features = ["research"]
