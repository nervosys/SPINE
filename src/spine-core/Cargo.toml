[package]
name = "spine-core"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core engine for the SPINE bioinspired agentic browser"

[dependencies]
spine-name = { path = "../spine-name", version = "2.0.2", features = ["storage"] }
spine-storage = { path = "../spine-storage", version = "2.0.2" }
spine-parser = { path = "../spine-parser", version = "2.0.2" }
spine-protocol = { path = "../spine-protocol", version = "2.0.2", default-features = false }
spine-mesh = { path = "../spine-mesh", version = "2.0.2" }
spine-wasm = { path = "../spine-wasm", version = "2.0.2" }
spine-neural = { path = "../spine-neural", version = "2.0.2", optional = true }
spine-human = { path = "../spine-human", version = "2.0.2", optional = true }
spine-cluster = { path = "../spine-cluster", version = "2.0.2", optional = true }
spine-agentic = { path = "../spine-agentic", version = "2.0.2", optional = true }
spine-transport = { path = "../spine-transport", version = "2.0.2" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
reqwest.workspace = true
dashmap.workspace = true
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
prometheus.workspace = true
lazy_static.workspace = true
axum = "0.7"
toml = "0.8"
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
rcgen = "0.13"
sha2 = "0.10"
base64 = "0.22"
futures = "0.3"
async-trait = "0.1"
tempfile = "3"
ed25519-dalek.workspace = true

[dev-dependencies]
tempfile = "3"
spine-agent = { path = "../spine-agent", version = "2.0.2" }

[features]
default = []
# Off by default. Cluster swarm, latent/morph and neural-transmit commands, agentic state and
# the human transpiler. spine-wasm is the execution layer, not research.
research = [
    "dep:spine-agentic",
    "dep:spine-cluster",
    "dep:spine-neural",
    "dep:spine-human",
    "spine-protocol/research",
]
quic = ["spine-protocol/quic"]
