[package]
name = "spine-cli"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line interface for the SPINE agentic web stack"

[[bin]]
name = "spine"
path = "src/main.rs"

[dependencies]
spine-name = { path = "../spine-name", version = "2.0.2" }
ed25519-dalek.workspace = true
rand.workspace = true
spine-agent = { path = "../spine-agent", version = "2.0.2" }
spine-protocol = { path = "../spine-protocol", version = "2.0.2" }
spine-parser = { path = "../spine-parser", version = "2.0.2" }
spine-core = { path = "../spine-core", version = "2.0.2" }
spine-transport = { path = "../spine-transport", version = "2.0.2" }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
toml = "0.8"
colored = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { workspace = true }
rustls-pemfile = "2"
tokio-rustls = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# `spine deploy` and `spine-core` run the sibling `spine-core` binary, which is
# research-free unless it is built with `research`. This feature forwards it, so
# `cargo build --release -p spine-core -p spine-cli --features spine-cli/research`
# builds both against one research-enabled `spine-core` (workspace resolver 2
# unifies the feature across the selected packages). Off by default.
research = ["spine-core/research"]
