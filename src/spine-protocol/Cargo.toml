[package]
name = "spine-protocol"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Low-latency communication protocols for SPINE"

[features]
default = ["quic"]
quic = ["dep:quinn", "dep:rcgen", "dep:rustls-pki-types"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Serialize Vec<u8> tensor/byte payloads as compact CBOR byte strings
# (1-byte overhead) instead of integer arrays.
serde_bytes = "0.11"
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
# For high throughput, maybe tonic (gRPC) or a custom binary protocol
# For now, let's stick to basic networking
zstd = "0.13"
# Compact, self-describing binary wire codec (RFC 8949 CBOR). Handles
# serde_json::Value natively (unlike bincode/postcard, which need deserialize_any).
ciborium = "0.2"
spine-cbor = { path = "../spine-cbor", version = "2.0.2" }
uuid = { version = "1", features = ["v4", "serde"] }
rustls.workspace = true

# QUIC transport (optional, for fallback/0-RTT connections)
quinn = { version = "0.11", optional = true }
rcgen = { version = "0.12", optional = true }
rustls-pki-types = { version = "1", optional = true }

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "hot_path_bench"
harness = false

[[example]]
name = "wire_sizes"
path = "examples/wire_sizes.rs"

[[example]]
name = "mcp_stdio_server"
path = "examples/mcp_stdio_server.rs"

[[test]]
name = "chaos"
path = "tests/chaos.rs"

[[test]]
name = "e2e_protocol"
path = "tests/e2e_protocol.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
