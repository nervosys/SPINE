[package]
name = "spine-protocol"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Low-latency communication protocols for SPINE"

[features]
default = ["quic", "research"]
quic = ["dep:quinn", "dep:rcgen", "dep:rustls-pki-types"]
# Research code: the Chameleon latent-space key, the speculative predictor,
# `SpineConnection`, the protocol evolution framework and `TitansLatentCodec`.
# It is the only code that needs spine-neural and spine-crypto. Build with
# `--no-default-features` (plus `quic` if wanted) for the wire types, the codec
# and `ProtocolHandler` (which then has no chameleon and never predicts).
research = ["dep:spine-neural", "dep:spine-crypto"]

[dependencies]
tracing = { workspace = true }
serde.workspace = true
serde_json.workspace = true
# Serialize Vec<u8> tensor/byte payloads as compact CBOR byte strings
# (1-byte overhead) instead of integer arrays.
serde_bytes = "0.11"
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
# For high throughput, maybe tonic (gRPC) or a custom binary protocol
# For now, let's stick to basic networking
bytes = "1.5"
zstd = "0.13"
# Compact, self-describing binary wire codec (RFC 8949 CBOR). Handles
# serde_json::Value natively (unlike bincode/postcard, which need deserialize_any).
ciborium = "0.2"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
spine-neural = { path = "../spine-neural", version = "2.0.2", optional = true }
spine-crypto = { path = "../spine-crypto", version = "2.0.2", optional = true }
rustls.workspace = true
# High-performance binary serialization (5-10x faster than JSON)
bincode = "1.3"
bytemuck = { version = "1.14", features = ["derive"] }
parking_lot = "0.12"
zeroize = { version = "1.8", features = ["derive"] }

# QUIC transport (optional, for fallback/0-RTT connections)
quinn = { version = "0.11", optional = true }
rcgen = { version = "0.12", optional = true }
rustls-pki-types = { version = "1", optional = true }

[dev-dependencies]
proptest = "1.4"
spine-nostd = { path = "../spine-nostd" }
spine-embedded = { path = "../spine-embedded" }
tokio-test = "0.4"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "hot_path_bench"
harness = false

[[bench]]
name = "neural_codec_bench"
harness = false
required-features = ["research"]

[[example]]
name = "wire_sizes"
path = "examples/wire_sizes.rs"

[[example]]
name = "mcp_stdio_server"
path = "examples/mcp_stdio_server.rs"

[[example]]
name = "chameleon_demo"
path = "examples/chameleon_demo.rs"
required-features = ["research"]

[[test]]
name = "chaos"
path = "tests/chaos.rs"

[[test]]
name = "e2e_protocol"
path = "tests/e2e_protocol.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
