[package]
name = "spine-stream"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
version = "2.0.2"
readme = "README.md"
edition = "2021"
description = "High-performance streaming layer for SPINE bioinspired agentic web stack"
authors = ["Nervosys LLC <opensource@nervosys.ai>"]
license = "AGPL-3.0-or-later"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "sync", "time", "io-util"] }
futures = "0.3"
pin-project-lite = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
bytes = "1.6"

# Compression
zstd = "0.13"
crc32fast = "1.4"

# Concurrency
dashmap.workspace = true
parking_lot = "0.12"

# Utilities
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "serde"] }

# Internal dependencies
spine-transport = { path = "../spine-transport", version = "2.0.2" }

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "stream_bench"
harness = false

[features]
default = ["backpressure", "multiplexing"]
backpressure = []
multiplexing = []
priority-queues = []
