[package]
name = "spine-web"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SPINE — agentic-first web stack. Umbrella facade that re-exports the spine-* component crates behind feature flags."
readme = "README.md"

# This crate is a thin facade: it contains no logic of its own, only re-exports
# of the component crates, each gated behind a feature of the same name. Pick the
# pieces you need; nothing is pulled unless its feature is on. The research
# crates (neural, crypto, agentic, cluster, human, recursive, knowledge, kernel,
# gpu, mechgen, k8s) are never in `default`.

[dependencies]
spine-protocol  = { path = "../spine-protocol",  version = "2.0.2", optional = true }
spine-transport = { path = "../spine-transport", version = "2.0.2", optional = true }
spine-parser    = { path = "../spine-parser",    version = "2.0.2", optional = true }
spine-name      = { path = "../spine-name",      version = "2.0.2", optional = true }
spine-compiler  = { path = "../spine-compiler",  version = "2.0.2", optional = true }
spine-wasm      = { path = "../spine-wasm",      version = "2.0.2", optional = true }
spine-neural    = { path = "../../research/spine-neural",    version = "2.0.2", optional = true }
spine-crypto    = { path = "../../research/spine-crypto",    version = "2.0.2", optional = true }
spine-agent     = { path = "../spine-agent",     version = "2.0.2", optional = true }
spine-agentic   = { path = "../../research/spine-agentic",   version = "2.0.2", optional = true }
spine-cluster   = { path = "../../research/spine-cluster",   version = "2.0.2", optional = true }
spine-human     = { path = "../../research/spine-human",     version = "2.0.2", optional = true }
spine-stream    = { path = "../spine-stream",    version = "2.0.2", optional = true }
spine-recursive = { path = "../../research/spine-recursive", version = "2.0.2", optional = true }
spine-knowledge = { path = "../../research/spine-knowledge", version = "2.0.2", optional = true }
spine-storage   = { path = "../spine-storage",   version = "2.0.2", optional = true }
spine-kernel    = { path = "../../research/spine-kernel",    version = "2.0.2", optional = true }
spine-gpu       = { path = "../../research/spine-gpu",       version = "2.0.2", optional = true }
spine-grpc      = { path = "../spine-grpc",      version = "2.0.2", optional = true }
spine-mechgen   = { path = "../../research/spine-mechgen",   version = "2.0.2", optional = true }
spine-core      = { path = "../spine-core",      version = "2.0.2", optional = true }
spine-cache     = { path = "../spine-cache",     version = "2.0.2", optional = true }
spine-k8s       = { path = "../../research/spine-k8s",       version = "2.0.2", optional = true }

[features]
# A practical agentic-web starter built only from the stable workspace crates:
# the wire protocol, transport, the agent runtime and the `spine://` namespace.
# No research crate is in the default build; opt in with `research` (all of them)
# or with the individual features below.
default = ["protocol", "transport", "agent", "name"]

# Every research crate except the heavy backends (`gpu`, `k8s`), plus the
# research code paths of the stable crates that have them. Pulls in spine-neural
# and spine-crypto (through `spine-protocol/research`), spine-agentic,
# spine-human and spine-cluster, and the rest of research/.
research = [
    "protocol", "spine-protocol/research",
    "spine-agent?/research", "spine-core?/research",
    "neural", "crypto", "agentic", "cluster", "human", "recursive",
    "knowledge", "kernel", "mechgen",
]

# Everything that is a reusable library: the stable crates plus `research`.
# Heavy optional backends (GPU, Kubernetes) come in only via their own features
# below, not via `full`.
full = [
    "research",
    "protocol", "transport", "parser", "compiler", "wasm", "agent", "stream",
    "storage", "grpc", "core", "cache", "name",
]

# One feature per component crate.
protocol  = ["dep:spine-protocol"]
transport = ["dep:spine-transport"]
parser    = ["dep:spine-parser"]
name      = ["dep:spine-name"]
compiler  = ["dep:spine-compiler"]
wasm      = ["dep:spine-wasm"]
neural    = ["dep:spine-neural"]
crypto    = ["dep:spine-crypto"]
agent     = ["dep:spine-agent"]
agentic   = ["dep:spine-agentic"]
cluster   = ["dep:spine-cluster"]
human     = ["dep:spine-human"]
stream    = ["dep:spine-stream"]
recursive = ["dep:spine-recursive"]
knowledge = ["dep:spine-knowledge"]
storage   = ["dep:spine-storage"]
kernel    = ["dep:spine-kernel"]
gpu       = ["dep:spine-gpu"]
grpc      = ["dep:spine-grpc"]
mechgen   = ["dep:spine-mechgen"]
core      = ["dep:spine-core"]
cache     = ["dep:spine-cache"]
k8s       = ["dep:spine-k8s"]

[package.metadata.docs.rs]
features = ["full"]
rustdoc-args = ["--cfg", "docsrs"]
