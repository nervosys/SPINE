# cargo-deny configuration (v0.19+)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Ignore specific advisories by RUSTSEC ID.
#
# Every entry here is `informational = "unmaintained"` -- a crate with no
# maintained successor to move to, which is not a fix anyone can apply. No
# actual vulnerability is suppressed, and none should be: if one reappears
# through a dependency, this job must fail rather than stay quiet.
#
# It did not always read that way. Until 2026-08-25 this list also carried five
# real vulnerabilities -- integer overflow in `bytes`, stack-recursion DoS in
# `protobuf`, stack exhaustion in `serde_json`, and two in `wasmtime` -- each
# with a rationale for why it was tolerable. A `cargo update` that day moved the
# tree past all five, and cargo-deny then reported every one of them as
# "advisory was not encountered: no crate matched advisory criteria". They were
# suppressing nothing, so they are gone. Check for that warning before assuming
# an entry here is still doing work.
ignore = [
    # bincode unmaintained — pinned to v1.x, stable API
    "RUSTSEC-2025-0141",
    # derivative unmaintained — transitive
    "RUSTSEC-2024-0388",
    # fxhash unmaintained — transitive via criterion
    "RUSTSEC-2025-0057",
    # instant unmaintained — transitive via criterion/parking_lot
    "RUSTSEC-2024-0384",
    # number_prefix unmaintained — transitive via indicatif
    "RUSTSEC-2025-0119",
    # paste unmaintained — transitive
    "RUSTSEC-2024-0436",
    # proc-macro-error unmaintained — transitive
    "RUSTSEC-2024-0370",
    # rustls-pemfile unmaintained — transitive via rustls
    "RUSTSEC-2025-0134",
    # backoff unmaintained — transitive via kube-runtime
    "RUSTSEC-2025-0012",
    # ttf-parser unmaintained — transitive via owned_ttf_parser → ab_glyph
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "CDLA-Permissive-2.0",

    # SPINE's own 30 crates. Their absence is why this job failed on every run:
    # the workspace relicensed to AGPL-3.0-or-later and the allow-list was not
    # moved with it, so cargo-deny rejected the workspace against itself. The
    # entry below still said Apache-2.0 long after LICENSE said otherwise.
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.8

# `ring` ships a compound license its metadata does not spell out.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# epaint bundles fonts (OFL-1.1, Ubuntu Font License — permissive, manually reviewed)
[[licenses.exceptions]]
name = "epaint"
allow = ["LicenseRef-UFL-1.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
