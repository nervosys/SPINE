name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  release:
    types: [created]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets)
        run: cargo clippy --workspace --exclude spine-browser --all-targets -- -D warnings

  # ── Security Audit ─────────────────────────────────────────────────────────
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-test-

      - name: Build workspace
        run: cargo build --workspace --exclude spine-browser --target ${{ matrix.target }}

      - name: Run tests (lib + integration)
        run: cargo test --workspace --exclude spine-browser --lib --tests --target ${{ matrix.target }}

      - name: Run doc tests
        run: cargo test --workspace --exclude spine-browser --doc --target ${{ matrix.target }}


  # -- Coverage ---------------------------------------------------------------
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-coverage-

      - name: Generate coverage
        run: cargo llvm-cov --workspace --exclude spine-browser --lib --tests --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # -- Deny Check -------------------------------------------------------------
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  # -- MSRV Check -------------------------------------------------------------
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.88.0

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msrv-

      - name: Check MSRV compilation
        run: cargo check --workspace --exclude spine-browser

  # ── Build Release Binaries ─────────────────────────────────────────────────
  build:
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: spine-linux-x64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: spine-windows-x64
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: spine-macos-arm64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-release-

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p spine-core -p spine-cli -p spine-gateway

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/spine-core${{ matrix.ext }} dist/${{ matrix.artifact }}/
          cp target/${{ matrix.target }}/release/spine${{ matrix.ext }} dist/${{ matrix.artifact }}/
          cp target/${{ matrix.target }}/release/spine-gateway${{ matrix.ext }} dist/${{ matrix.artifact }}/
          cp README.md ARCHITECTURE.md HLS_SPEC.md THREAT_MODEL.md dist/${{ matrix.artifact }}/
          cd dist && tar -czvf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.artifact }}
          Copy-Item target/${{ matrix.target }}/release/spine-core${{ matrix.ext }} dist/${{ matrix.artifact }}/
          Copy-Item target/${{ matrix.target }}/release/spine${{ matrix.ext }} dist/${{ matrix.artifact }}/
          Copy-Item target/${{ matrix.target }}/release/spine-gateway${{ matrix.ext }} dist/${{ matrix.artifact }}/
          Copy-Item README.md, ARCHITECTURE.md, HLS_SPEC.md, THREAT_MODEL.md dist/${{ matrix.artifact }}/
          Compress-Archive -Path dist/${{ matrix.artifact }} -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*
  # ── Documentation ───────────────────────────────────────────────────────────
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-docs-

      - name: Build API docs
        run: cargo doc --workspace --exclude spine-browser --no-deps

      - uses: actions/upload-artifact@v6
        with:
          name: api-documentation
          path: target/doc
  # -- Benchmarks (regression detection)  ------------------------------------
  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-

      - name: Run benchmarks
        run: |
          cargo bench -p spine-protocol --bench hot_path_bench -- --output-format bencher | tee bench_output.txt
          cargo bench -p spine-transport --bench transport_bench -- --output-format bencher | tee -a bench_output.txt
          cargo bench -p spine-kernel --bench kernel_bench -- --output-format bencher | tee -a bench_output.txt

      # The benchmark-history step that stood here never worked. It used
      # benchmark-action/github-action-benchmark, which fetches a `gh-pages`
      # branch to compare against -- this repository has no such branch, so the
      # step failed with "couldn't find remote ref gh-pages" on every run. Its
      # auto-push condition was also dead: it tested `refs/heads/main` when the
      # default branch is `master`, so even with the branch present nothing
      # would ever have been stored.
      #
      # The benchmarks themselves are the value and still run above. Restoring
      # regression tracking means creating a `gh-pages` branch and deciding
      # whether benchmark history should be publicly served from it -- a
      # decision, not a fix, so it is not made here.
      - name: Upload benchmark output
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: bench_output.txt

  # ── Release ─────────────────────────────────────────────────────────────────
  release:
    needs: [build, docs, version-guard]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/spine-linux-x64/*.tar.gz
            artifacts/spine-windows-x64/*.zip
            artifacts/spine-macos-arm64/*.tar.gz

  # ── Release version guard ───────────────────────────────────────────────────
  # Fails a release whose tag disagrees with the workspace manifest.
  #
  # This is not hypothetical. Every tag from v1.0.0 through v1.9.1 shipped with
  # Cargo.toml still reading version = "1.0.0" — thirteen releases declaring one
  # crate version between them. Nothing objected, because nothing was looking.
  # crates.io would have: it rejects a duplicate version, so no release after
  # the first could have been published there at all.
  version-guard:
    name: Manifest version matches the tag
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Compare the workspace version with the release tag
        run: |
          set -euo pipefail
          manifest=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
              | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          tag="${GITHUB_REF_NAME#v}"

          echo "manifest: ${manifest:-<none found>}"
          echo "tag:      $tag"

          if [ -z "$manifest" ]; then
            echo "::error::no version found under [workspace.package] in Cargo.toml"
            exit 1
          fi

          if [ "$manifest" != "$tag" ]; then
            echo "::error::release tag $tag does not match the manifest version $manifest."
            echo "::error::Bump [workspace.package].version and the intra-workspace"
            echo "::error::dependency pins together, then re-tag."
            exit 1
          fi

          echo "OK: manifest and tag agree at $manifest"
